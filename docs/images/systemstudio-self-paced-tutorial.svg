<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title description">
  <title id="title">SystemStudio CIS 310 self-paced tutorial</title>
  <desc id="description">A Visual Studio Code-style tutorial with all eight lessons visible in a left navigator and lesson four open on the right.</desc>
  <defs>
    <linearGradient id="lesson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a57"/>
      <stop offset="1" stop-color="#252526"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1440" height="840" rx="14" fill="#181818"/>
  <rect width="1440" height="44" rx="14" fill="#323233"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="720" y="28" text-anchor="middle" fill="#cccccc" font-family="Segoe UI, Arial, sans-serif" font-size="15">SystemStudio CIS 310 — Self-Paced Tutorial</text>

  <rect x="0" y="44" width="1440" height="82" fill="#252526"/>
  <text x="42" y="78" fill="#f2f2f2" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">CIS 310 Guided Tutorial</text>
  <text x="42" y="105" fill="#aaaaaa" font-family="Segoe UI, Arial, sans-serif" font-size="13">Choose any lesson · work in any order · skip, resume, or rerun at any time</text>
  <rect x="1187" y="67" width="96" height="36" rx="6" fill="#3a3d41"/><text x="1235" y="90" text-anchor="middle" fill="#dedede" font-family="Segoe UI, Arial, sans-serif" font-size="13">Skip for now</text>
  <rect x="1294" y="67" width="100" height="36" rx="6" fill="none" stroke="#777"/><text x="1344" y="90" text-anchor="middle" fill="#dedede" font-family="Segoe UI, Arial, sans-serif" font-size="13">Close</text>

  <rect x="0" y="126" width="1440" height="8" fill="#303030"/>
  <rect x="0" y="126" width="720" height="8" fill="#73c991"/>

  <rect x="34" y="160" width="322" height="590" rx="10" fill="#202020" stroke="#464646"/>
  <text x="58" y="194" fill="#f0f0f0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650">Choose any lesson</text>
  <text x="58" y="218" fill="#999999" font-family="Segoe UI, Arial, sans-serif" font-size="12">All eight lessons remain visible.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="50" y="238" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="262" r="14" fill="#4a4a4a"/><text x="73" y="267" text-anchor="middle" fill="#fff">1</text><text x="98" y="267" fill="#dddddd">Choose today’s goal</text><text x="322" y="267" text-anchor="end" fill="#73c991">✓</text>
    <rect x="50" y="294" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="318" r="14" fill="#4a4a4a"/><text x="73" y="323" text-anchor="middle" fill="#fff">2</text><text x="98" y="323" fill="#dddddd">Learn and submit</text><text x="322" y="323" text-anchor="end" fill="#73c991">✓</text>
    <rect x="50" y="350" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="374" r="14" fill="#4a4a4a"/><text x="73" y="379" text-anchor="middle" fill="#fff">3</text><text x="98" y="379" fill="#dddddd">Setup or my work?</text><text x="322" y="379" text-anchor="end" fill="#73c991">•</text>
    <rect x="50" y="406" width="290" height="49" rx="7" fill="#094771" stroke="#3794ff"/><circle cx="73" cy="430" r="14" fill="#0e639c"/><text x="73" y="435" text-anchor="middle" fill="#fff">4</text><text x="98" y="435" fill="#ffffff" font-weight="650">Concept to circuit</text>
    <rect x="50" y="462" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="486" r="14" fill="#4a4a4a"/><text x="73" y="491" text-anchor="middle" fill="#fff">5</text><text x="98" y="491" fill="#dddddd">Concept to assembly</text>
    <rect x="50" y="518" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="542" r="14" fill="#4a4a4a"/><text x="73" y="547" text-anchor="middle" fill="#fff">6</text><text x="98" y="547" fill="#dddddd">Inspect evidence</text>
    <rect x="50" y="574" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="598" r="14" fill="#4a4a4a"/><text x="73" y="603" text-anchor="middle" fill="#fff">7</text><text x="98" y="603" fill="#dddddd">Choose support</text>
    <rect x="50" y="630" width="290" height="49" rx="7" fill="#262626"/><circle cx="73" cy="654" r="14" fill="#4a4a4a"/><text x="73" y="659" text-anchor="middle" fill="#fff">8</text><text x="98" y="659" fill="#dddddd">Recover and continue</text>
  </g>
  <text x="58" y="716" fill="#8f8f8f" font-family="Segoe UI, Arial, sans-serif" font-size="12">✓ reviewed · • partly explored</text>

  <rect x="386" y="160" width="1018" height="590" rx="12" fill="url(#lesson)" stroke="#3794ff" filter="url(#shadow)"/>
  <text x="424" y="202" fill="#9aa9b5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">LESSON 4 OF 8 · SELF-PACED</text>
  <text x="424" y="246" fill="#f4f4f4" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650">Bridge a concept to a circuit</text>
  <text x="424" y="278" fill="#d3d3d3" font-family="Segoe UI, Arial, sans-serif" font-size="15">Follow the full sequence or sample the stage you need today. Each stage should produce evidence.</text>

  <rect x="424" y="316" width="284" height="218" rx="9" fill="#242424" stroke="#4a4a4a"/>
  <text x="448" y="352" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Read and predict</text>
  <text x="448" y="382" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">Open the mapped text and video.</text>
  <text x="448" y="405" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">Write expected inputs and outputs</text>
  <text x="448" y="428" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">before opening the simulator.</text>
  <rect x="448" y="466" width="126" height="36" rx="5" fill="none" stroke="#777"/><text x="511" y="489" text-anchor="middle" fill="#e8e8e8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Explore stage</text>

  <rect x="730" y="316" width="284" height="218" rx="9" fill="#242424" stroke="#4a4a4a"/>
  <text x="754" y="352" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Build small</text>
  <text x="754" y="382" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">Create a blank circuit and implement</text>
  <text x="754" y="405" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">one bounded behavior at a time.</text>
  <rect x="754" y="466" width="126" height="36" rx="5" fill="none" stroke="#777"/><text x="817" y="489" text-anchor="middle" fill="#e8e8e8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Explore stage</text>

  <rect x="1036" y="316" width="328" height="218" rx="9" fill="#242424" stroke="#4a4a4a"/>
  <text x="1060" y="352" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Test, inspect, explain</text>
  <text x="1060" y="382" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">Compare simulation evidence with</text>
  <text x="1060" y="405" fill="#bdbdbd" font-family="Segoe UI, Arial, sans-serif" font-size="13">your prediction and explain a mismatch.</text>
  <rect x="1060" y="466" width="126" height="36" rx="5" fill="none" stroke="#777"/><text x="1123" y="489" text-anchor="middle" fill="#e8e8e8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Explore stage</text>

  <text x="424" y="587" fill="#73c991" font-family="Segoe UI, Arial, sans-serif" font-size="13">Self-paced: continue now or review more choices.</text>
  <rect x="424" y="626" width="108" height="38" rx="6" fill="#3a3d41"/><text x="478" y="650" text-anchor="middle" fill="#dedede" font-family="Segoe UI, Arial, sans-serif" font-size="13">Back</text>
  <rect x="1219" y="626" width="145" height="38" rx="6" fill="#0e639c"/><text x="1291" y="650" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">Next lesson</text>
  <text x="1398" y="814" text-anchor="end" fill="#787878" font-family="Segoe UI, Arial, sans-serif" font-size="11">Interface overview · v0.10.3</text>
</svg>
