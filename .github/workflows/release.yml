name: Publish extension release

on:
  push:
    tags:
      - 'cis310-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build, test, and package
        working-directory: extension
        run: npm run package

      - name: Audit packaged boundary
        working-directory: extension
        run: npm run audit:vsix

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" extension/systemstudio-cis310.vsix \
            --title "CIS 310 ${GITHUB_REF_NAME#cis310-v}" \
            --generate-notes \
            --verify-tag
